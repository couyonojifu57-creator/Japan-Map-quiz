<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>にっぽん名産地図｜47都道府県をおぼえよう</title>
<style>
  :root{--paper:#F4EFE3;--sea:#CFE0E6;--ink:#2A2620;--sub:#7A7264;--line:#C9BFA9;
        --ok:#2F8F5B;--ng:#C7473F;}
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;
    line-height:1.6;padding:20px 14px 48px;}
  .wrap{max-width:760px;margin:0 auto;}
  .eyebrow{font-size:.7rem;letter-spacing:.3em;color:var(--sub);margin:0 0 6px;font-weight:800;}
  h1{font-weight:800;font-size:clamp(1.5rem,5.5vw,2.2rem);margin:0;letter-spacing:.03em;}
  h1 .en{display:block;font-family:Georgia,serif;font-style:italic;font-size:.4em;
    color:var(--sub);letter-spacing:.06em;margin-top:5px;font-weight:400;}

  /* モード切替 */
  .modes{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:999px;
    padding:4px;margin:16px 0 12px;gap:2px;}
  .modes button{border:none;cursor:pointer;font:inherit;font-weight:800;font-size:.9rem;
    padding:8px 20px;border-radius:999px;background:transparent;color:var(--sub);}
  .modes button[aria-selected="true"]{background:var(--ink);color:#fff;}

  /* ===== まなぶモード ===== */
  .explore-only{display:block;}
  .quiz-only{display:none;}
  body.quiz .explore-only{display:none;}
  body.quiz .quiz-only{display:block;}

  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 10px;}
  .toggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-weight:700;font-size:.82rem;
    background:var(--ink);color:#fff;border:none;border-radius:999px;padding:8px 16px;}
  .toggle .state{font-size:.72rem;opacity:.7;font-weight:600;}
  .hint{font-size:.76rem;color:var(--sub);}
  .legend{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px;}
  .legend button{border:1px solid var(--line);cursor:pointer;font:inherit;background:#fff;color:var(--ink);
    display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:700;
    padding:4px 10px;border-radius:999px;transition:opacity .15s;}
  .legend button .dot{width:11px;height:11px;border-radius:50%;flex:none;}
  .legend button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink);}
  .legend.dim button:not([aria-pressed="true"]){opacity:.4;}

  /* ===== クイズモード ===== */
  .quizbar{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;
    margin-bottom:12px;box-shadow:0 6px 20px -16px rgba(0,0,0,.4);}
  .quizbar .top{display:flex;justify-content:space-between;align-items:center;font-weight:800;
    font-size:.8rem;color:var(--sub);margin-bottom:6px;}
  .quizbar .q{font-size:clamp(1.1rem,4.5vw,1.5rem);font-weight:800;line-height:1.4;}
  .quizbar .q rt{font-size:.5em;color:var(--sub);font-weight:600;}
  .quizbar .q .em{font-size:1.5em;vertical-align:-.15em;margin-right:4px;}
  .quizbar .feedback{font-size:.9rem;font-weight:800;margin-top:6px;min-height:1.4em;}
  .quizbar .feedback.ok{color:var(--ok);}
  .quizbar .feedback.ng{color:var(--ng);}
  .quizrow{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap;}
  .btn{border:none;cursor:pointer;font:inherit;font-weight:800;font-size:.82rem;
    padding:8px 16px;border-radius:999px;}
  .btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink);}
  .btn.dark{background:var(--ink);color:#fff;}
  .stars{font-size:.9rem;letter-spacing:2px;}

  .mapwrap{background:var(--sea);border:1px solid var(--line);border-radius:16px;
    padding:8px;box-shadow:0 10px 30px -18px rgba(0,0,0,.45);position:relative;}
  svg{width:100%;height:auto;display:block;touch-action:manipulation;}
  .pref{cursor:pointer;}
  .pref path{stroke:#F4EFE3;stroke-width:1.1;transition:filter .12s;}
  .pref:hover path{filter:brightness(1.14);}
  .pref.sel path{stroke:#fff;stroke-width:2.4;filter:brightness(1.12);}
  .pref.faded{opacity:.28;filter:grayscale(.5);}
  .pref.correct path{stroke:#fff;stroke-width:3;fill:var(--ok)!important;}
  .pref.wrong path{stroke:#fff;stroke-width:3;fill:var(--ng)!important;}
  .pref.target path{stroke:#FFD34E;stroke-width:4;filter:brightness(1.15) drop-shadow(0 0 6px rgba(255,211,78,.9));}
  @keyframes pulse{0%{transform:scale(1);}50%{transform:scale(1.06);}100%{transform:scale(1);}}
  .pref.pulse{animation:pulse .5s ease;transform-box:fill-box;transform-origin:center;}
  .answerrow{display:flex;gap:8px;margin-top:10px;}
  .answerrow input{flex:1;min-width:0;font:inherit;font-size:1.05rem;font-weight:700;
    padding:11px 14px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);}
  .answerrow input:focus{outline:none;border-color:var(--ink);}
  /* HUD */
  .hud{display:flex;align-items:stretch;gap:8px;margin-bottom:10px;}
  .hud-item{flex:1;background:#fff;border:1px solid var(--line);border-radius:14px;
    padding:8px 6px;text-align:center;font-weight:900;font-size:1.15rem;line-height:1.1;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;}
  .hud-item small{font-size:.6rem;font-weight:700;color:var(--sub);}
  .hud-item.pop{animation:hudpop .35s ease;}
  @keyframes hudpop{0%{transform:scale(1);}45%{transform:scale(1.18);}100%{transform:scale(1);}}
  .hud-item.combo.hot{background:#FFF3E0;border-color:#F0A030;color:#D2673F;}
  .soundbtn{flex:none;width:46px;border:1px solid var(--line);background:#fff;border-radius:14px;
    font-size:1.3rem;cursor:pointer;}
  .soundbtn[aria-pressed="false"]{opacity:.45;}
  .progress{height:10px;background:#e7dfcd;border-radius:999px;overflow:hidden;margin-bottom:10px;}
  .progress .bar{height:100%;width:0;background:linear-gradient(90deg,#5C8F3A,#C48328);
    border-radius:999px;transition:width .3s ease;}
  /* コンボの舞うポイント表示 */
  .floatpts{position:absolute;left:50%;top:30%;transform:translateX(-50%);
    font-size:2rem;font-weight:900;color:#C48328;pointer-events:none;opacity:0;z-index:6;
    text-shadow:0 2px 6px rgba(0,0,0,.25);}
  .floatpts.go{animation:floatup 1s ease forwards;}
  @keyframes floatup{0%{opacity:0;transform:translate(-50%,10px) scale(.7);}
    20%{opacity:1;transform:translate(-50%,-6px) scale(1.1);}
    100%{opacity:0;transform:translate(-50%,-60px) scale(1);}}
  /* 紙吹雪 */
  .confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:5;}
  .confetti i{position:absolute;top:-12px;width:9px;height:9px;border-radius:2px;opacity:.95;
    animation:fall 1.1s ease-in forwards;}
  @keyframes fall{to{transform:translateY(120%) rotate(720deg);opacity:0;}}
  .emoji{font-size:20px;text-anchor:middle;dominant-baseline:central;pointer-events:none;}
  .pname{font-size:13px;font-weight:800;text-anchor:middle;dominant-baseline:central;
    fill:#fff;paint-order:stroke;stroke:rgba(40,38,32,.85);stroke-width:3px;pointer-events:none;}
  body.names-off .pname{display:none;}
  body.quiz .pname{display:none;}
  body.quiz .emoji{display:none;}
  .okframe{fill:rgba(255,255,255,.55);stroke:#9c937f;stroke-width:1.4;stroke-dasharray:5 4;}
  .oklabel{font-size:15px;font-weight:800;fill:var(--sub);text-anchor:middle;}
  .mark{font-size:64px;text-anchor:middle;dominant-baseline:central;font-weight:900;pointer-events:none;
    opacity:0;transition:opacity .2s;}
  .mark.show{opacity:1;}

  /* まなぶ 詳細パネル */
  .detail{margin-top:16px;display:flex;align-items:center;gap:16px;background:#fff;
    border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:0 6px 20px -16px rgba(0,0,0,.4);}
  .detail .big{font-size:3rem;line-height:1;flex:none;}
  .detail .rtag{display:inline-block;font-size:.68rem;font-weight:800;color:#fff;
    padding:2px 10px;border-radius:999px;margin-bottom:5px;letter-spacing:.05em;}
  .detail h2{margin:0;font-size:1.5rem;font-weight:800;}
  .detail h2 rt{font-size:.5em;font-weight:600;color:var(--sub);}
  .detail p{margin:3px 0 0;color:var(--sub);font-size:.92rem;}
  .detail p b{color:var(--ink);font-size:1.05rem;}
  .detail p rt{font-size:.6em;color:var(--sub);}

  /* 結果オーバーレイ */
  .result{position:fixed;inset:0;background:rgba(42,38,32,.55);display:none;
    align-items:center;justify-content:center;padding:20px;z-index:10;}
  .result.show{display:flex;}
  .card{background:var(--paper);border-radius:20px;padding:28px 24px;max-width:360px;width:100%;
    text-align:center;box-shadow:0 20px 60px -20px rgba(0,0,0,.6);}
  .card .score{font-size:2.4rem;font-weight:800;margin:6px 0;}
  .card .bigstars{font-size:1.6rem;letter-spacing:4px;margin:8px 0 14px;}
  .card .msg{color:var(--sub);margin-bottom:18px;}

  footer{margin-top:20px;font-size:.72rem;color:var(--sub);text-align:center;line-height:1.7;}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">47 PREFECTURES</p>
  <h1>にっぽん名産地図<span class="en">learn Japan by its local treasures</span></h1>

  <div class="modes" role="tablist">
    <button id="mExplore" role="tab" aria-selected="true">まなぶ</button>
    <button id="mQuiz" role="tab" aria-selected="false">クイズ</button>
  </div>

  <!-- まなぶ -->
  <div class="explore-only">
    <div class="toolbar">
      <button class="toggle" id="nameToggle" aria-pressed="true">県名 <span class="state" id="nameState">見えてます</span></button>
      <span class="hint">👆 県をタップすると名前と名産がわかるよ</span>
    </div>
    <div class="legend" id="legend"></div>
  </div>

  <!-- クイズ -->
  <div class="quiz-only">
    <div class="hud">
      <div class="hud-item" id="hPointsWrap">⭐<span id="hPoints">0</span><small>ポイント</small></div>
      <div class="hud-item" id="hCoinsWrap">🪙<span id="hCoins">0</span><small>コイン</small></div>
      <div class="hud-item combo" id="hComboWrap">🔥<span id="hCombo">0</span><small>コンボ</small></div>
      <button class="soundbtn" id="soundBtn" aria-pressed="true" title="音のオン・オフ">🔊</button>
    </div>
    <div class="progress"><div class="bar" id="qBar"></div></div>
    <div class="quizbar">
      <div class="top"><span id="qProg">もんだい 1 / 10</span><span>せいかい <span id="qScore">0</span></span></div>
      <div class="q" id="qText">スタートをおしてね</div>
      <div class="answerrow">
        <input id="qInput" type="text" inputmode="text" autocomplete="off" autocapitalize="off"
               spellcheck="false" placeholder="県名を ひらがな か 漢字で" />
        <button class="btn dark" id="qGo">こたえる</button>
      </div>
      <div class="feedback" id="qFb"></div>
      <div class="quizrow">
        <button class="btn ghost" id="qHint">ヒント（さいしょの字）</button>
        <button class="btn ghost" id="qSkip">パス ▶</button>
        <span class="stars" id="qStars"></span>
      </div>
    </div>
  </div>

  <div class="mapwrap">
    <svg id="map" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="日本の47都道府県の地図"></svg>
    <div class="confetti" id="confetti"></div>
    <div class="floatpts" id="floatpts"></div>
  </div>

  <!-- まなぶ詳細 -->
  <div class="detail explore-only" id="detail">
    <div class="big" id="dEmoji">🍊</div>
    <div>
      <span class="rtag" id="dReg">四国</span>
      <h2 id="dName"><ruby>愛媛県<rt>えひめけん</rt></ruby></h2>
      <p>名産：<b id="dSpec">みかん</b></p>
    </div>
  </div>

  <footer>
    名産は各県の代表例をひとつ選んだものです。沖縄県は左下のわくの中にあります。
  </footer>
</div>

<!-- 結果 -->
<div class="result" id="result">
  <div class="card">
    <div style="font-weight:800;color:var(--sub);">けっか はっぴょう</div>
    <div class="score"><span id="rScore">0</span> / 10 せいかい</div>
    <div class="bigstars" id="rStars"></div>
    <div style="font-size:1.1rem;font-weight:900;margin-bottom:4px;">⭐ <span id="rPoints">0</span> ポイント　🪙 <span id="rCoins">0</span> コイン</div>
    <div class="msg" id="rMsg"></div>
    <div style="font-size:.8rem;color:var(--sub);margin-bottom:12px;">これまでの さいこう記録：<b id="rBest">0</b> ポイント</div>
    <button class="btn dark" id="rAgain" style="font-size:1rem;padding:10px 28px;">もういちど！</button>
  </div>
</div>

const svg=document.getElementById("map");
svg.setAttribute("viewBox",`0 0 ${DATA.width} ${DATA.height}`);
const NS="http://www.w3.org/2000/svg";

const b=DATA.okbox;
const fr=document.createElementNS(NS,"rect");
fr.setAttribute("x",b.x);fr.setAttribute("y",b.y);fr.setAttribute("width",b.w);
fr.setAttribute("height",b.h);fr.setAttribute("rx",8);fr.setAttribute("class","okframe");svg.appendChild(fr);
const okl=document.createElementNS(NS,"text");
okl.setAttribute("x",b.x+b.w/2);okl.setAttribute("y",b.y+18);okl.setAttribute("class","oklabel");
okl.textContent="沖縄";svg.appendChild(okl);

const byId={};const groups={};
DATA.prefs.forEach(p=>{byId[p.id]=p;
  const reg=DATA.regions[p.reg];
  const g=document.createElementNS(NS,"g");
  g.setAttribute("class","pref");g.dataset.reg=p.reg;g.dataset.id=p.id;
  g.setAttribute("tabindex","0");g.setAttribute("role","button");g.setAttribute("aria-label",p.ja);
  const path=document.createElementNS(NS,"path");
  path.setAttribute("d",p.path);path.setAttribute("fill",reg[1]);g.appendChild(path);
  const em=document.createElementNS(NS,"text");
  em.setAttribute("x",p.cx);em.setAttribute("y",p.cy);em.setAttribute("class","emoji");
  em.textContent=p.emoji;g.appendChild(em);
  const nm=document.createElementNS(NS,"text");
  nm.setAttribute("x",p.cx);nm.setAttribute("y",p.cy+16);nm.setAttribute("class","pname");
  nm.textContent=p.ja==="北海道"?"北海道":p.ja.replace(/[県都府]$/,"");g.appendChild(nm);
  g._nm=nm;g._em=em;
  g.addEventListener("click",()=>onTap(p));
  g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();onTap(p);}});
  svg.appendChild(g);groups[p.id]=g;
});
// 〇✕マーク
const mark=document.createElementNS(NS,"text");mark.setAttribute("class","mark");svg.appendChild(mark);
// 湖（琵琶湖など）を県の上に描画（タップは県に通す）
(DATA.lakes||[]).forEach(l=>{
  const lp=document.createElementNS(NS,"path");
  lp.setAttribute("d",l.path);lp.setAttribute("fill","#8FC4E8");
  lp.setAttribute("stroke","#4E90C0");lp.setAttribute("stroke-width","1");
  lp.setAttribute("pointer-events","none");
  svg.appendChild(lp);
});
// 滋賀のラベル・絵文字は湖の上に出す
if(groups[25]){svg.appendChild(groups[25]._em);svg.appendChild(groups[25]._nm);}

function fullReading(p){const last=p.ja.slice(-1);
  if(p.ja==="北海道")return"ほっかいどう";
  if(last==="都")return p.yomi+"と";
  if(last==="府")return p.yomi+"ふ";
  return p.yomi+"けん";}

/* ===== モード ===== */
let mode="explore";
const mE=document.getElementById("mExplore"),mQ=document.getElementById("mQuiz");
mE.onclick=()=>setMode("explore");mQ.onclick=()=>setMode("quiz");
function setMode(m){mode=m;
  document.body.classList.toggle("quiz",m==="quiz");
  mE.setAttribute("aria-selected",String(m==="explore"));
  mQ.setAttribute("aria-selected",String(m==="quiz"));
  clearMarks();
  applyLabels();
  if(m==="quiz")startQuiz();
}
function onTap(p){if(mode==="explore")select(p);}

// 地図のラベル（県名・絵文字）の表示をJSで確実に制御
function applyLabels(){
  const showNames=(mode==="explore"&&namesOn);
  const showEmoji=(mode==="explore");
  Object.values(groups).forEach(g=>{
    g._nm.style.display=showNames?"":"none";
    g._em.style.display=showEmoji?"":"none";
  });
}

/* ===== まなぶ ===== */
const dEmoji=document.getElementById("dEmoji"),dName=document.getElementById("dName"),
  dSpec=document.getElementById("dSpec"),dReg=document.getElementById("dReg");
function select(p){const reg=DATA.regions[p.reg];
  dEmoji.textContent=p.emoji;
  dName.innerHTML=`<ruby>${p.ja}<rt>${fullReading(p)}</rt></ruby>`;
  dSpec.innerHTML=`<ruby>${p.spec}<rt>${p.specyomi}</rt></ruby>`;
  dReg.textContent=reg[0];dReg.style.background=reg[1];
  Object.values(groups).forEach(g=>g.classList.remove("sel"));
  groups[p.id].classList.add("sel");}
const nameToggle=document.getElementById("nameToggle"),nameState=document.getElementById("nameState");
let namesOn=true;
nameToggle.onclick=()=>{namesOn=!namesOn;document.body.classList.toggle("names-off",!namesOn);
  nameToggle.setAttribute("aria-pressed",String(namesOn));
  nameState.textContent=namesOn?"見えてます":"かくれてます";applyLabels();};
const legend=document.getElementById("legend");let active=null;
Object.entries(DATA.regions).forEach(([key,r])=>{const btn=document.createElement("button");
  btn.setAttribute("aria-pressed","false");
  btn.innerHTML=`<span class="dot" style="background:${r[1]}"></span>${r[0]}`;
  btn.onclick=()=>{if(active===key){active=null;btn.setAttribute("aria-pressed","false");}
    else{active=key;legend.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed","false"));
      btn.setAttribute("aria-pressed","true");}
    legend.classList.toggle("dim",!!active);
    Object.values(groups).forEach(g=>g.classList.toggle("faded",active&&g.dataset.reg!==active));};
  legend.appendChild(btn);});
select(byId[38]);
applyLabels();

/* ===== クイズ ===== */
const N=10;
let quiz=[],qi=0,score=0,stars=0,wrongThis=0,locked=false;
const qText=document.getElementById("qText"),qFb=document.getElementById("qFb"),
  qProg=document.getElementById("qProg"),qScore=document.getElementById("qScore"),
  qStars=document.getElementById("qStars");
const qInput=document.getElementById("qInput");
// HUD・スコア状態
const hPoints=document.getElementById("hPoints"),hCoins=document.getElementById("hCoins"),
  hCombo=document.getElementById("hCombo"),hComboWrap=document.getElementById("hComboWrap"),
  hPointsWrap=document.getElementById("hPointsWrap"),hCoinsWrap=document.getElementById("hCoinsWrap"),
  qBar=document.getElementById("qBar");
let points=0,coins=0,combo=0,best=0;
function load(k,d){try{const v=localStorage.getItem(k);return v==null?d:v;}catch(e){return d;}}
function save(k,v){try{localStorage.setItem(k,v);}catch(e){}}
coins=parseInt(load("jp_coins","0"))||0;
best=parseInt(load("jp_best","0"))||0;
function updHUD(){hPoints.textContent=points;hCoins.textContent=coins;hCombo.textContent=combo;
  hComboWrap.classList.toggle("hot",combo>=3);}
function bump(el){el.classList.remove("pop");void el.offsetWidth;el.classList.add("pop");}
// サウンド（Web Audio・ファイル不要）
let actx=null,soundOn=true;
function ac(){if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){actx=null;}}return actx;}
function beep(freqs,dur,type,vol){if(!soundOn)return;const c=ac();if(!c)return;
  try{if(c.state==="suspended")c.resume();}catch(e){}
  const t0=c.currentTime;
  freqs.forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.type=type||"sine";
    o.frequency.value=f;const st=t0+i*(dur*0.9);
    g.gain.setValueAtTime(0,st);g.gain.linearRampToValueAtTime(vol||0.2,st+0.02);
    g.gain.exponentialRampToValueAtTime(0.001,st+dur);
    o.connect(g);g.connect(c.destination);o.start(st);o.stop(st+dur);});}
function sCorrect(){beep([660,880,1180],0.14,"triangle",0.22);}
function sCoin(){beep([1046,1568],0.09,"square",0.15);}
function sWrong(){beep([220,160],0.16,"sawtooth",0.16);}
function sFinish(){beep([523,659,784,1046],0.16,"triangle",0.2);}
const soundBtn=document.getElementById("soundBtn");
soundBtn.onclick=()=>{soundOn=!soundOn;soundBtn.setAttribute("aria-pressed",String(soundOn));
  soundBtn.textContent=soundOn?"🔊":"🔇";if(soundOn){ac();sCoin();}};
// エフェクト
const confettiBox=document.getElementById("confetti"),floatpts=document.getElementById("floatpts");
const CCOL=["#E4572E","#F0A030","#2F8F5B","#2E6088","#B23A44","#6B4C86","#FFD34E"];
function confetti(){for(let i=0;i<26;i++){const s=document.createElement("i");
  s.style.left=(Math.random()*100)+"%";s.style.background=CCOL[i%CCOL.length];
  s.style.animationDelay=(Math.random()*0.15)+"s";
  confettiBox.appendChild(s);setTimeout(()=>s.remove(),1300);}}
function showFloat(txt){floatpts.textContent=txt;floatpts.classList.remove("go");
  void floatpts.offsetWidth;floatpts.classList.add("go");}
updHUD();
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function startQuiz(){
  quiz=shuffle(DATA.prefs.slice()).slice(0,N).map(p=>({p}));
  qi=0;score=0;stars=0;points=0;combo=0;qScore.textContent="0";qStars.textContent="";
  updHUD();qBar.style.width="0%";
  document.getElementById("result").classList.remove("show");
  clearMarks();showQuestion();
}
// カタカナ→ひらがな、空白除去で正規化
function norm(s){return (s||"").trim().replace(/\s/g,"")
  .replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));}
// 正解として受け付ける表記の集合（漢字・ひらがな、県あり/なし）
function accepted(p){
  const base=p.ja==="北海道"?"北海道":p.ja.replace(/[県都府]$/,"");
  const last=p.ja.slice(-1);
  const suf=p.ja==="北海道"?"":(last==="都"?"と":last==="府"?"ふ":"けん");
  return new Set([p.ja,base,p.yomi,p.yomi+suf].map(norm));
}
function showQuestion(){
  locked=false;wrongThis=0;clearMarks();
  const {p}=quiz[qi];
  // 対象の県を光らせ、名産の絵文字だけヒント表示
  Object.values(groups).forEach(g=>g.classList.toggle("faded",g.dataset.id!==String(p.id)));
  groups[p.id].classList.add("target");
  groups[p.id]._em.style.display="";
  qProg.textContent=`もんだい ${qi+1} / ${N}`;
  qBar.style.width=(qi/N*100)+"%";
  qFb.textContent="";qFb.className="feedback";
  qText.innerHTML=`光っている県は なに県？<br><span style="font-size:.8em;color:var(--sub)">ヒント：名産は ${p.emoji} <ruby>${p.spec}<rt>${p.specyomi}</rt></ruby></span>`;
  qInput.value="";qInput.disabled=false;
  setTimeout(()=>qInput.focus(),50);
}
function checkAnswer(){
  if(locked||mode!=="quiz")return;
  const p=quiz[qi].p;
  const val=norm(qInput.value);
  if(!val)return;
  if(accepted(p).has(val)){
    locked=true;qInput.disabled=true;
    groups[p.id].classList.add("correct","pulse");
    showMark(p,"〇","var(--ok)");
    combo++;
    const gain=10+(combo>=2?(combo-1)*5:0)+(wrongThis===0?5:0);
    points+=gain;
    const coinGain=wrongThis===0?3:1;coins+=coinGain;
    score++;qScore.textContent=score;
    if(wrongThis===0)stars++;
    updHUD();bump(hPointsWrap);bump(hCoinsWrap);if(combo>=2)bump(hComboWrap);
    save("jp_coins",coins);
    showFloat("+"+gain);confetti();sCorrect();sCoin();
    const combomsg=combo>=3?`　${combo}コンボ！🔥`:"";
    qFb.innerHTML=`せいかい！🎉 <ruby>${p.ja}<rt>${fullReading(p)}</rt></ruby>${combomsg}`;qFb.className="feedback ok";
    setTimeout(next,1300);
  }else{
    wrongThis++;combo=0;updHUD();sWrong();
    qFb.textContent=wrongThis>=2?`おしい！「${p.yomi[0]}」ではじまるよ`:"ちがうよ、もういちど！";
    qFb.className="feedback ng";
    qInput.select();
  }
}
document.getElementById("qGo").onclick=checkAnswer;
qInput.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();checkAnswer();}});
function next(){qi++;if(qi>=N)finish();else showQuestion();}
function finish(){
  qBar.style.width="100%";
  document.getElementById("rScore").textContent=score;
  document.getElementById("rPoints").textContent=points;
  document.getElementById("rCoins").textContent=coins;
  if(points>best){best=points;save("jp_best",best);}
  document.getElementById("rBest").textContent=best;
  const full=Math.round(stars);
  document.getElementById("rStars").textContent="⭐".repeat(full)+"・".repeat(N-full);
  let msg;
  if(score===N)msg="ぜんもんせいかい！てんさい！";
  else if(score>=8)msg="すごい！よくできました！";
  else if(score>=5)msg="いいちょうし！もういちどやってみよう！";
  else msg="ナイスチャレンジ！くりかえせばおぼえられるよ！";
  document.getElementById("rMsg").textContent=msg;
  document.getElementById("result").classList.add("show");
  sFinish();confetti();
}
document.getElementById("rAgain").onclick=startQuiz;
document.getElementById("qSkip").onclick=()=>{if(!locked){qFb.textContent="";next();}};
document.getElementById("qHint").onclick=()=>{
  if(locked)return;
  const p=quiz[qi].p;
  qFb.textContent=`ヒント：「${p.yomi[0]}」ではじまるよ`;qFb.className="feedback";
};
function showMark(p,ch,color){mark.textContent=ch;mark.setAttribute("x",p.cx);
  mark.setAttribute("y",p.cy);mark.setAttribute("fill",color);mark.classList.add("show");}
function clearMarks(){mark.classList.remove("show");
  Object.values(groups).forEach(g=>{g.classList.remove("correct","wrong","pulse","faded","target");
    if(mode==="quiz")g._em.style.display="none";});}
</script>
</body>
</html>
